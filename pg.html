<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parent Guide App</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #2b2b2b;
        }
        /* Custom scrollbar for mobile frame */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #d97777;
            border-radius: 4px;
        }
        .app-bg {
            background-color: #E6B8B8;
        }
        .btn-rose {
            background-color: #D35454;
            transition: all 0.2s ease;
        }
        .btn-rose:hover {
            background-color: #b84343;
        }
        .btn-rose-dark {
            background-color: #A93232;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-0 sm:p-4">

    <!-- Mobile Device Container -->
    <div class="relative w-full sm:w-[412px] h-[100vh] sm:h-[840px] app-bg sm:rounded-[40px] shadow-2xl flex flex-col overflow-hidden border-0 sm:border-[10px] border-black">
        
        <!-- Phone Notch / Status Bar -->
        <div class="w-full bg-black text-white px-6 py-2 flex justify-between items-center text-xs z-50 select-none">
            <span id="current-time">9:41</span>
            <div class="w-24 h-4 bg-black rounded-b-xl absolute left-1/2 transform -translate-x-1/2 top-0 hidden sm:block"></div>
            <div class="flex space-x-2 items-center">
                <i class="fa-solid fa-signal text-[10px]"></i>
                <i class="fa-solid fa-wifi text-[10px]"></i>
                <i class="fa-solid fa-battery-full text-[10px]"></i>
            </div>
        </div>

        <!-- App Main Content Area -->
        <div id="screen-container" class="flex-1 relative overflow-y-auto flex flex-col">
            <!-- Screens will be injected dynamically by JavaScript -->
        </div>

        <!-- Slide-out Drawer Menu (Global) -->
        <div id="drawer-overlay" class="absolute inset-0 bg-black/50 z-50 hidden transition-opacity opacity-0" onclick="toggleDrawer()"></div>
        <div id="drawer-menu" class="absolute top-0 left-0 bottom-0 w-3/4 app-bg z-50 transform -translate-x-full transition-transform duration-300 shadow-2xl flex flex-col border-r border-[#D35454]">
            <div class="p-6 bg-[#D35454] text-white flex justify-between items-center">
                <h3 class="font-bold text-lg"><i class="fa-solid fa-bars mr-2"></i> Menu</h3>
                <button onclick="toggleDrawer()" class="text-white text-xl p-1"><i class="fa-solid fa-arrow-left"></i></button>
            </div>
            <div class="flex-1 py-4 flex flex-col space-y-1">
                <button onclick="navigate('settings'); toggleDrawer();" class="text-left px-6 py-3 font-semibold text-gray-800 hover:bg-[#d97777]/30 border-b border-[#d97777]/40 flex items-center"><i class="fa-solid fa-gear w-8 text-[#A93232]"></i> Setting</button>
                <button onclick="navigate('privacy'); toggleDrawer();" class="text-left px-6 py-3 font-semibold text-gray-800 hover:bg-[#d97777]/30 border-b border-[#d97777]/40 flex items-center"><i class="fa-solid fa-shield-halved w-8 text-[#A93232]"></i> Privacy & Policy</button>
                <button onclick="navigate('language'); toggleDrawer();" class="text-left px-6 py-3 font-semibold text-gray-800 hover:bg-[#d97777]/30 border-b border-[#d97777]/40 flex items-center"><i class="fa-solid fa-globe w-8 text-[#A93232]"></i> Language</button>
                <button onclick="navigate('help'); toggleDrawer();" class="text-left px-6 py-3 font-semibold text-gray-800 hover:bg-[#d97777]/30 border-b border-[#d97777]/40 flex items-center"><i class="fa-solid fa-circle-question w-8 text-[#A93232]"></i> Help</button>
                <button onclick="exitApp()" class="text-left px-6 py-3 font-semibold text-red-800 hover:bg-red-200/50 border-b border-[#d97777]/40 flex items-center"><i class="fa-solid fa-right-from-bracket w-8 text-red-700"></i> Exit</button>
            </div>
            <div class="p-4 text-center text-xs text-gray-700">Parent Guide v1.0.4</div>
        </div>

        <!-- Global Toast / Message Box -->
        <div id="toast" class="absolute bottom-16 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-4 py-2 rounded-xl text-sm shadow-xl opacity-0 pointer-events-none transition-opacity duration-300 z-50 flex items-center space-x-2">
            <i class="fa-solid fa-circle-check text-green-400"></i>
            <span id="toast-msg">Action successful!</span>
        </div>

    </div>

    <!-- Application Logic Script -->
    <script>
        // State Management
        let currentScreen = 'splash';
        let appState = {
            loadingProgress: 100,
            user: { name: 'Sarah Jenkins', email: 'sarah@example.com' },
            notes: [
                { id: 1, title: 'Feeding schedule', date: 'May 3, 2024', content: 'Baby takes 4 oz every 3 hours.' },
                { id: 2, title: 'Vaccination reminder', date: 'May 10, 2024', content: '2-month checkup at Dr. Smith clinic.' },
                { id: 3, title: 'Sleeping tips', date: 'May 15, 2024', content: 'Keep room dark and play white noise.' }
            ],
            tasks: [
                { id: 1, title: 'Buy organic baby formula', done: false, reminder: 'Today, 5:00 PM' },
                { id: 2, title: 'Pediatrician appointment', done: true, reminder: 'May 5, 10:00 AM' },
                { id: 3, title: 'Wash baby blankets', done: false, reminder: 'Tomorrow, 9:00 AM' }
            ],
            selectedCategory: null
        };

        // Update live time clock
        setInterval(() => {
            const now = new Date();
            let h = now.getHours();
            let m = now.getMinutes();
            m = m < 10 ? '0' + m : m;
            document.getElementById('current-time').innerText = `${h}:${m}`;
        }, 1000);

        // Navigation Router
        function navigate(screenName, param = null) {
            currentScreen = screenName;
            if (param !== null) appState.selectedCategory = param;
            render();
            // Scroll container to top on screen change
            const container = document.getElementById('screen-container');
            if (container) container.scrollTop = 0;
        }

        // Show Toast Notification
        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = message;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }

        // Toggle Drawer Menu
        function toggleDrawer() {
            const drawer = document.getElementById('drawer-menu');
            const overlay = document.getElementById('drawer-overlay');
            if (drawer.classList.contains('-translate-x-full')) {
                drawer.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.remove('opacity-0'), 10);
            } else {
                drawer.classList.add('-translate-x-full');
                overlay.classList.add('opacity-0');
                setTimeout(() => overlay.classList.add('hidden'), 300);
            }
        }

        // Exit Simulation
        function exitApp() {
            toggleDrawer();
            showToast('Exiting Parent Guide...');
            setTimeout(() => navigate('splash'), 1500);
        }

        // Main Render Function
        function render() {
            const container = document.getElementById('screen-container');
            let html = '';

            switch(currentScreen) {
                case 'splash':
                    html = renderSplashScreen();
                    break;
                case 'auth_choice':
                    html = renderAuthChoiceScreen();
                    break;
                case 'login':
                    html = renderLoginScreen();
                    break;
                case 'signup':
                    html = renderSignupScreen();
                    break;
                case 'create_account_details':
                    html = renderCreateAccountDetailsScreen();
                    break;
                case 'home':
                    html = renderHomeScreen();
                    break;
                case 'category_detail':
                    html = renderCategoryDetailScreen();
                    break;
                case 'notes':
                    html = renderNotesScreen();
                    break;
                case 'note_editor':
                    html = renderNoteEditorScreen();
                    break;
                case 'tasks':
                    html = renderTasksScreen();
                    break;
                case 'chat':
                    html = renderChatScreen();
                    break;
                case 'feedback':
                    html = renderFeedbackScreen();
                    break;
                case 'settings':
                    html = renderStaticPageScreen('Settings', 'Manage your app preferences, notification sounds, and account details here.');
                    break;
                case 'privacy':
                    html = renderStaticPageScreen('Privacy & Policy', 'We value your privacy. All child and parent data is securely encrypted locally and never shared with third parties.');
                    break;
                case 'language':
                    html = renderStaticPageScreen('Language', 'Select your preferred language: English (Default), Spanish, French, Tagalog.');
                    break;
                case 'help':
                    html = renderStaticPageScreen('Help & Support', 'Contact our expert pediatric support team 24/7 at support@parentguide.app or call 1-800-PARENT.');
                    break;
                default:
                    html = renderHomeScreen();
            }

            container.innerHTML = html;
        }

        // --- SCREEN BUILDERS ---

        function renderSplashScreen() {
            return `
                <div class="flex-1 flex flex-col items-center justify-between p-8 text-center animate-fadeIn">
                    <div class="mt-4">
                        <h1 class="text-3xl font-extrabold text-[#D35454] tracking-wider">WELCOME<br><span class="text-2xl">TO</span></h1>
                    </div>
                    
                    <!-- Cura Image & Title -->
                    <div class="relative my-4 flex flex-col items-center justify-center">
                        <img src="cura.png" alt="Cura Logo" class="w-44 h-44 object-contain drop-shadow-md" onerror="this.onerror=null; this.src='https://placehold.co/180x180/E6B8B8/D35454?text=Cura+Logo';">
                        <div class="mt-3 text-xl font-extrabold text-[#D35454] tracking-widest">PARENT GUIDE</div>
                    </div>

                    <div class="w-full flex flex-col items-center mb-4">
                        <button onclick="navigate('auth_choice')" class="w-full py-4 btn-rose text-white rounded-full font-bold shadow-lg text-lg uppercase tracking-wider flex items-center justify-center space-x-2">
                            <span>CLICK TO START</span>
                            <i class="fa-solid fa-arrow-right"></i>
                        </button>
                        <p class="text-xs text-gray-700 mt-3 tracking-widest uppercase">LOADING</p>
                    </div>
                </div>
            `;
        }

        function renderAuthChoiceScreen() {
            return `
                <div class="flex-1 flex flex-col items-center justify-center p-8 text-center">
                    <div class="mb-6">
                        <svg class="w-24 h-24 text-[#D35454] mx-auto" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                        </svg>
                        <h2 class="text-2xl font-bold text-[#D35454] mt-2">Parent Guide</h2>
                    </div>

                    <div class="bg-white/80 p-6 rounded-3xl shadow-xl w-full max-w-sm flex flex-col space-y-4">
                        <h3 class="text-lg font-bold text-gray-800">Welcome Back!</h3>
                        <button onclick="navigate('login')" class="w-full py-3 btn-rose text-white rounded-xl font-bold shadow">Login to Account</button>
                        <button onclick="navigate('signup')" class="w-full py-3 bg-gray-200 text-gray-800 hover:bg-gray-300 rounded-xl font-bold shadow">Create New Account</button>
                        <button onclick="navigate('home')" class="text-xs text-[#D35454] font-semibold underline mt-2">Skip & Continue as Guest</button>
                    </div>
                </div>
            `;
        }

        function renderLoginScreen() {
            return `
                <div class="flex-1 flex flex-col p-6 justify-between">
                    <div class="flex items-center justify-between">
                        <button onclick="navigate('auth_choice')" class="text-xl text-gray-800 p-2"><i class="fa-solid fa-arrow-left"></i></button>
                        <span class="text-sm font-bold text-[#D35454]">LOGIN</span>
                        <div class="w-8"></div>
                    </div>

                    <div class="my-auto bg-white/90 p-6 rounded-3xl shadow-xl w-full flex flex-col space-y-4">
                        <div class="text-center mb-2">
                            <i class="fa-solid fa-user-circle text-4xl text-[#D35454]"></i>
                            <h3 class="font-bold text-lg text-gray-800 mt-1">Sign In</h3>
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-gray-600">Email or Number</label>
                            <input type="text" id="login-email" placeholder="email@domain.com" class="w-full mt-1 p-3 bg-gray-100 rounded-xl border border-gray-300 focus:outline-none focus:border-[#D35454]" value="parent@guide.com">
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-gray-600">Password</label>
                            <input type="password" id="login-pass" placeholder="••••••••" class="w-full mt-1 p-3 bg-gray-100 rounded-xl border border-gray-300 focus:outline-none focus:border-[#D35454]" value="password123">
                        </div>
                        <button onclick="handleLogin()" class="w-full py-3 btn-rose text-white rounded-xl font-bold shadow mt-2">LOGIN</button>
                    </div>

                    <div class="text-center pb-4">
                        <p class="text-xs text-gray-700">Don't have an account? <span onclick="navigate('signup')" class="text-[#D35454] font-bold cursor-pointer underline">Sign Up</span></p>
                    </div>
                </div>
            `;
        }

        function renderSignupScreen() {
            return `
                <div class="flex-1 flex flex-col p-6 justify-between">
                    <div class="flex items-center justify-between">
                        <button onclick="navigate('auth_choice')" class="text-xl text-gray-800 p-2"><i class="fa-solid fa-arrow-left"></i></button>
                        <span class="text-sm font-bold text-[#D35454]">SIGN UP</span>
                        <div class="w-8"></div>
                    </div>

                    <div class="my-auto bg-white/90 p-6 rounded-3xl shadow-xl w-full flex flex-col space-y-4">
                        <div class="text-center mb-1">
                            <h3 class="font-bold text-xl text-[#D35454]">Create Account</h3>
                            <p class="text-xs text-gray-500">Step 1 of 2: Credentials</p>
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-gray-600">Email / Number</label>
                            <input type="text" placeholder="Enter email or phone" class="w-full mt-1 p-3 bg-gray-100 rounded-xl border border-gray-300 focus:outline-none focus:border-[#D35454]">
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-gray-600">Password</label>
                            <input type="password" placeholder="Create password" class="w-full mt-1 p-3 bg-gray-100 rounded-xl border border-gray-300 focus:outline-none focus:border-[#D35454]">
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-gray-600">Re-write password</label>
                            <input type="password" placeholder="Confirm password" class="w-full mt-1 p-3 bg-gray-100 rounded-xl border border-gray-300 focus:outline-none focus:border-[#D35454]">
                        </div>
                        <button onclick="navigate('create_account_details')" class="w-full py-3 btn-rose text-white rounded-xl font-bold shadow mt-2">NEXT: PROFILE DETAILS</button>
                    </div>

                    <div class="text-center pb-2">
                        <p class="text-xs text-gray-700">Already have an account? <span onclick="navigate('login')" class="text-[#D35454] font-bold cursor-pointer underline">Login</span></p>
                    </div>
                </div>
            `;
        }

        function renderCreateAccountDetailsScreen() {
            return `
                <div class="flex-1 flex flex-col p-6 overflow-y-auto">
                    <div class="flex items-center justify-between mb-4">
                        <button onclick="navigate('signup')" class="text-xl text-gray-800 p-2"><i class="fa-solid fa-arrow-left"></i></button>
                        <span class="text-sm font-bold text-[#D35454]">PARENT PROFILE</span>
                        <div class="w-8"></div>
                    </div>

                    <div class="bg-white/90 p-5 rounded-3xl shadow-xl w-full flex flex-col space-y-3 mb-6">
                        <h3 class="font-bold text-lg text-gray-800 text-center mb-1">Create Account Details</h3>
                        
                        <div>
                            <label class="text-xs font-semibold text-gray-600">Name and Lastname</label>
                            <input type="text" placeholder="e.g. Maria Santos" class="w-full mt-1 p-2.5 bg-gray-100 rounded-xl border border-gray-300 text-sm">
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-gray-600">Contact Number</label>
                            <input type="text" placeholder="+63 912 345 6789" class="w-full mt-1 p-2.5 bg-gray-100 rounded-xl border border-gray-300 text-sm">
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-gray-600">ID Number</label>
                            <input type="text" placeholder="Government ID / License No." class="w-full mt-1 p-2.5 bg-gray-100 rounded-xl border border-gray-300 text-sm">
                        </div>

                        <div class="grid grid-cols-2 gap-2 pt-1">
                            <label class="flex flex-col items-center justify-center p-3 bg-gray-100 border border-dashed border-gray-400 rounded-xl cursor-pointer hover:bg-gray-200">
                                <i class="fa-solid fa-id-card text-[#D35454] mb-1 text-lg"></i>
                                <span class="text-xs font-semibold text-gray-700">ID Picture</span>
                                <input type="file" class="hidden">
                            </label>
                            <label class="flex flex-col items-center justify-center p-3 bg-gray-100 border border-dashed border-gray-400 rounded-xl cursor-pointer hover:bg-gray-200">
                                <i class="fa-solid fa-user text-[#D35454] mb-1 text-lg"></i>
                                <span class="text-xs font-semibold text-gray-700">1x1 Picture</span>
                                <input type="file" class="hidden">
                            </label>
                            <label class="flex flex-col items-center justify-center p-3 bg-gray-100 border border-dashed border-gray-400 rounded-xl cursor-pointer hover:bg-gray-200">
                                <i class="fa-solid fa-signature text-[#D35454] mb-1 text-lg"></i>
                                <span class="text-xs font-semibold text-gray-700">Signature</span>
                                <input type="file" class="hidden">
                            </label>
                            <label class="flex flex-col items-center justify-center p-3 bg-gray-100 border border-dashed border-gray-400 rounded-xl cursor-pointer hover:bg-gray-200">
                                <i class="fa-solid fa-file-lines text-[#D35454] mb-1 text-lg"></i>
                                <span class="text-xs font-semibold text-gray-700 text-center">Child Birth Cert</span>
                                <input type="file" class="hidden">
                            </label>
                        </div>

                        <div>
                            <label class="text-xs font-semibold text-gray-600">Reason of Applying</label>
                            <textarea rows="2" placeholder="Why do you wish to join Parent Guide?" class="w-full mt-1 p-2.5 bg-gray-100 rounded-xl border border-gray-300 text-sm"></textarea>
                        </div>

                        <button onclick="handleAccountCreation()" class="w-full py-3 btn-rose text-white rounded-xl font-bold shadow">CREATE ACCOUNT</button>
                    </div>
                </div>
            `;
        }

        function renderHomeScreen() {
            return `
                <div class="flex-1 flex flex-col pb-20">
                    <!-- Top Bar -->
                    <div class="px-6 py-4 flex items-center justify-between border-b border-[#D35454]/30">
                        <button onclick="toggleDrawer()" class="text-2xl text-gray-800"><i class="fa-solid fa-bars"></i></button>
                        <div class="flex-1 mx-4">
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 flex items-center pl-3"><i class="fa-solid fa-search text-white text-xs"></i></span>
                                <input type="text" placeholder="SEARCH" class="w-full py-2 pl-9 pr-4 btn-rose text-white placeholder-white/80 rounded-full text-xs font-bold text-center focus:outline-none shadow">
                            </div>
                        </div>
                        <button onclick="navigate('settings')" class="w-8 h-8 rounded-full bg-[#D35454] text-white flex items-center justify-center shadow"><i class="fa-solid fa-user text-xs"></i></button>
                    </div>

                    <!-- Categories Content -->
                    <div class="px-6 py-4 flex-1">
                        <h2 class="text-xs font-extrabold text-gray-800 uppercase tracking-wider mb-4">Categories</h2>
                        
                        <div class="space-y-3">
                            <button onclick="navigate('category_detail', 'Basic Child Care')" class="w-full py-3 px-6 btn-rose text-white rounded-xl font-bold shadow-md flex items-center justify-between">
                                <span>BASIC CHILD CARE</span>
                                <i class="fa-solid fa-chevron-right text-xs"></i>
                            </button>
                            <button onclick="navigate('category_detail', 'Health and Wellness of Child')" class="w-full py-3 px-6 btn-rose text-white rounded-xl font-bold shadow-md flex items-center justify-between">
                                <span class="text-left">HEALTH AND WELLNESS OF CHILD</span>
                                <i class="fa-solid fa-chevron-right text-xs"></i>
                            </button>
                            <button onclick="navigate('category_detail', 'Safety Tips')" class="w-full py-3 px-6 btn-rose text-white rounded-xl font-bold shadow-md flex items-center justify-between">
                                <span>SAFETY TIPS</span>
                                <i class="fa-solid fa-chevron-right text-xs"></i>
                            </button>
                            <button onclick="navigate('category_detail', 'Nutrition and Eating')" class="w-full py-3 px-6 btn-rose text-white rounded-xl font-bold shadow-md flex items-center justify-between">
                                <span>NUTRITION AND EATING</span>
                                <i class="fa-solid fa-chevron-right text-xs"></i>
                            </button>
                            
                            <div class="text-center my-1">
                                <span onclick="navigate('category_detail', 'More Topics')" class="text-xs font-bold text-[#A93232] cursor-pointer underline uppercase">More</span>
                            </div>

                            <button onclick="navigate('chat')" class="w-full py-3 px-6 btn-rose text-white rounded-xl font-bold shadow-md flex items-center justify-between mt-2">
                                <span class="flex items-center"><i class="fa-solid fa-comments mr-2"></i> EXPERT CHAT ROOM</span>
                                <i class="fa-solid fa-chevron-right text-xs"></i>
                            </button>
                            <button onclick="navigate('help')" class="w-full py-3 px-6 btn-rose text-white rounded-xl font-bold shadow-md flex items-center justify-between">
                                <span class="flex items-center"><i class="fa-solid fa-life-ring mr-2"></i> CHILD SUPPORT/HELP</span>
                                <i class="fa-solid fa-chevron-right text-xs"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Bottom Navigation Bar -->
                    ${renderBottomNav('home')}
                </div>
            `;
        }

        function renderCategoryDetailScreen() {
            const catName = appState.selectedCategory || 'Health and Wellness of Child';
            return `
                <div class="flex-1 flex flex-col p-6 pb-20 justify-between">
                    <div>
                        <div class="flex items-center justify-between mb-4">
                            <button onclick="navigate('home')" class="text-xl text-gray-800 p-2"><i class="fa-solid fa-arrow-left"></i></button>
                            <button onclick="showToast('Information Saved!')" class="text-xs font-bold bg-[#D35454] text-white px-3 py-1.5 rounded-lg shadow">SAVE</button>
                        </div>

                        <div class="bg-white/80 p-5 rounded-3xl shadow-xl space-y-4">
                            <h2 class="text-base font-extrabold text-[#D35454] uppercase tracking-wide text-center border-b pb-2">${catName}</h2>
                            <div class="text-xs text-gray-800 space-y-3 leading-relaxed">
                                <p class="font-semibold text-gray-900">For Infants (0-1 year)</p>
                                <ul class="list-disc pl-5 space-y-2">
                                    <li><strong>Nutrition:</strong> Breastfeeding is highly recommended for at least the first six months as it provides all the necessary nutrients for an infant. If breastfeeding isn't possible, use infant formula. Introduction to solid foods should begin around six months.</li>
                                    <li><strong>Physical Activity:</strong> Encourage playtime on their tummy to help strengthen their neck and shoulder muscles and improve motor skills.</li>
                                    <li><strong>Sleep:</strong> Infants require about 14-17 hours of quality sleep per day to support rapid brain and body development.</li>
                                </ul>
                            </div>
                            
                            <div class="pt-2 text-center">
                                <button onclick="navigate('note_editor')" class="w-12 h-12 rounded-full btn-rose text-white inline-flex items-center justify-center shadow-lg transform hover:scale-105 transition">
                                    <i class="fa-solid fa-play"></i>
                                </button>
                            </div>
                        </div>

                        <div class="mt-4 text-center">
                            <button onclick="navigate('feedback')" class="w-full py-3 btn-rose-dark text-white rounded-xl font-bold shadow-md text-xs uppercase tracking-wider">
                                COMMENTS / FEEDBACK
                            </button>
                        </div>
                    </div>

                    ${renderBottomNav('home')}
                </div>
            `;
        }

        function renderNotesScreen() {
            return `
                <div class="flex-1 flex flex-col pb-20">
                    <div class="px-6 py-4 flex items-center justify-between border-b border-[#D35454]/30">
                        <button onclick="navigate('home')" class="text-xl text-gray-800"><i class="fa-solid fa-arrow-left"></i></button>
                        <span class="text-sm font-bold text-[#D35454]">NOTES & SAVED INFO</span>
                        <button onclick="navigate('note_editor')" class="text-xs font-bold bg-[#D35454] text-white px-3 py-1.5 rounded-lg shadow"><i class="fa-solid fa-plus mr-1"></i> New</button>
                    </div>

                    <div class="px-6 py-4 flex-1 space-y-3">
                        <div class="flex items-center justify-between bg-white/90 p-4 rounded-2xl shadow">
                            <div class="flex items-center space-x-3">
                                <i class="fa-solid fa-folder-open text-2xl text-[#D35454]"></i>
                                <span class="text-xs font-bold text-gray-800 uppercase">Save Information</span>
                            </div>
                            <i class="fa-solid fa-arrow-down text-gray-600 text-xs animate-bounce"></i>
                        </div>

                        ${appState.notes.map(note => `
                            <div onclick="navigate('note_editor')" class="bg-white/90 p-4 rounded-2xl shadow hover:bg-white cursor-pointer transition">
                                <div class="flex justify-between items-center mb-1">
                                    <h4 class="text-xs font-bold text-[#D35454] uppercase">${note.title}</h4>
                                    <span class="text-[10px] text-gray-500">${note.date}</span>
                                </div>
                                <p class="text-xs text-gray-700 line-clamp-2">${note.content}</p>
                            </div>
                        `).join('')}
                    </div>

                    ${renderBottomNav('notes')}
                </div>
            `;
        }

        function renderNoteEditorScreen() {
            return `
                <div class="flex-1 flex flex-col p-6 pb-6">
                    <div class="flex items-center justify-between mb-4">
                        <button onclick="navigate('notes')" class="text-xl text-gray-800 p-2"><i class="fa-solid fa-arrow-left"></i></button>
                        <button onclick="showToast('Note Saved Successfully!'); navigate('notes');" class="text-xs font-bold bg-[#D35454] text-white px-3 py-1.5 rounded-lg shadow">SAVE</button>
                    </div>

                    <div class="bg-white/90 p-5 rounded-3xl shadow-xl flex-1 flex flex-col">
                        <div class="mb-3">
                            <label class="text-xs font-bold text-[#D35454] uppercase">TITLE:</label>
                            <input type="text" id="note-title-input" placeholder="Enter note title..." class="w-full mt-1 p-2 bg-gray-100 rounded-xl border border-gray-300 text-sm font-semibold focus:outline-none focus:border-[#D35454]" value="Infant Care Journal">
                        </div>
                        
                        <div class="flex justify-between items-center text-[11px] text-gray-500 mb-2 border-b pb-2">
                            <span>May 3, 2026</span>
                            <span id="char-count">142 Characters</span>
                        </div>

                        <div class="flex-1 flex flex-col">
                            <textarea id="note-content-input" oninput="updateCharCount()" placeholder="START TYPING..." class="w-full flex-1 p-3 bg-gray-100 rounded-xl border border-gray-300 text-xs focus:outline-none focus:border-[#D35454] resize-none">Today was a great milestone. Baby smiled for the first time during morning tummy time and slept through the 3-hour feeding cycle seamlessly.</textarea>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderTasksScreen() {
            return `
                <div class="flex-1 flex flex-col pb-20">
                    <div class="px-6 py-4 flex items-center justify-between border-b border-[#D35454]/30 bg-[#E6B8B8]">
                        <button onclick="navigate('home')" class="text-xl text-gray-800"><i class="fa-solid fa-arrow-left"></i></button>
                        <h2 class="text-sm font-extrabold text-gray-900 tracking-wider">TASKS</h2>
                        <div class="w-8"></div>
                    </div>

                    <div class="px-6 py-4 flex-1 space-y-3">
                        ${appState.tasks.map((task, idx) => `
                            <div class="bg-white/90 p-4 rounded-2xl shadow flex items-center justify-between">
                                <div class="flex items-center space-x-3">
                                    <input type="checkbox" ${task.done ? 'checked' : ''} onchange="toggleTask(${task.id})" class="w-5 h-5 accent-[#D35454] rounded cursor-pointer">
                                    <div>
                                        <p class="text-xs font-bold ${task.done ? 'line-through text-gray-400' : 'text-gray-800'}">${task.title}</p>
                                        <p class="text-[10px] text-gray-500"><i class="fa-regular fa-clock mr-1"></i> ${task.reminder}</p>
                                    </div>
                                </div>
                                <button onclick="deleteTask(${task.id})" class="text-gray-400 hover:text-red-600 p-1"><i class="fa-solid fa-trash text-xs"></i></button>
                            </div>
                        `).join('')}

                        <!-- Add Task Card Box -->
                        <div class="bg-gray-800 text-white p-4 rounded-3xl shadow-xl mt-6 space-y-3">
                            <div class="flex items-center space-x-2">
                                <input type="checkbox" disabled class="w-5 h-5 accent-[#D35454]">
                                <input type="text" id="new-task-title" placeholder="TYPE HERE..." class="bg-transparent text-xs text-white placeholder-gray-400 focus:outline-none w-full">
                            </div>
                            <div class="flex justify-between items-center pt-2 border-t border-gray-700">
                                <button onclick="addNewTask()" class="text-[11px] text-gray-300 hover:text-white flex items-center"><i class="fa-solid fa-bell text-[#D35454] mr-1.5"></i> SET REMINDER</button>
                                <button onclick="addNewTask()" class="bg-[#D35454] hover:bg-[#b84343] text-white text-xs font-bold px-4 py-1.5 rounded-xl shadow">DONE</button>
                            </div>
                        </div>
                    </div>

                    ${renderBottomNav('tasks')}
                </div>
            `;
        }

        function renderChatScreen() {
            return `
                <div class="flex-1 flex flex-col pb-20">
                    <div class="px-6 py-4 flex items-center justify-between border-b border-[#D35454]/30 bg-[#E6B8B8]">
                        <button onclick="navigate('home')" class="text-xl text-gray-800"><i class="fa-solid fa-arrow-left"></i></button>
                        <h2 class="text-sm font-extrabold text-gray-900 tracking-wider">EXPERT CHAT ROOM</h2>
                        <div class="w-8"></div>
                    </div>

                    <div class="px-4 py-4 flex-1 space-y-3 overflow-y-auto">
                        <div class="flex items-start space-x-2">
                            <div class="w-8 h-8 rounded-full bg-[#D35454] text-white flex items-center justify-center text-xs font-bold">DR</div>
                            <div class="bg-white/90 p-3 rounded-2xl rounded-tl-none shadow max-w-[80%] text-xs text-gray-800">
                                <p class="font-bold text-[#D35454] mb-1">Dr. Mendoza (Pediatrician)</p>
                                Hello! Welcome to the Parent Guide expert chat room. How can I assist you and your child today?
                            </div>
                        </div>
                        <div class="flex items-start space-x-2 justify-end">
                            <div class="bg-[#D35454] text-white p-3 rounded-2xl rounded-tr-none shadow max-w-[80%] text-xs">
                                Hi Doctor, my baby is 4 months old and recently started drooling a lot. Is this normal teething sign?
                            </div>
                        </div>
                        <div class="flex items-start space-x-2">
                            <div class="w-8 h-8 rounded-full bg-[#D35454] text-white flex items-center justify-center text-xs font-bold">DR</div>
                            <div class="bg-white/90 p-3 rounded-2xl rounded-tl-none shadow max-w-[80%] text-xs text-gray-800">
                                <p class="font-bold text-[#D35454] mb-1">Dr. Mendoza (Pediatrician)</p>
                                Yes, increased drooling around 3-5 months is totally normal! Salivary glands become very active ahead of teething.
                            </div>
                        </div>
                    </div>

                    <div class="p-3 bg-white/80 border-t flex items-center space-x-2">
                        <input type="text" id="chat-input" placeholder="Type a message to expert..." class="flex-1 py-2 px-3 bg-gray-100 rounded-xl text-xs focus:outline-none border">
                        <button onclick="sendChatMessage()" class="w-10 h-10 btn-rose text-white rounded-xl flex items-center justify-center shadow"><i class="fa-solid fa-paper-plane text-xs"></i></button>
                    </div>

                    ${renderBottomNav('home')}
                </div>
            `;
        }

        function renderFeedbackScreen() {
            return `
                <div class="flex-1 flex flex-col p-6 justify-between">
                    <div class="flex items-center justify-between">
                        <button onclick="navigate('category_detail')" class="text-xl text-gray-800 p-2"><i class="fa-solid fa-arrow-left"></i></button>
                        <span class="text-sm font-bold text-[#D35454]">COMMENTS & FEEDBACK</span>
                        <div class="w-8"></div>
                    </div>

                    <div class="bg-white/90 p-6 rounded-3xl shadow-xl w-full flex flex-col space-y-4 my-auto">
                        <div class="text-center">
                            <i class="fa-solid fa-comment-dots text-3xl text-[#D35454] mb-1"></i>
                            <h3 class="font-bold text-base text-gray-800">We value your feedback</h3>
                            <p class="text-xs text-gray-500">Help us improve Parent Guide guides and features.</p>
                        </div>
                        
                        <div class="flex justify-center space-x-2 py-2">
                            <i class="fa-solid fa-star text-yellow-400 text-xl cursor-pointer"></i>
                            <i class="fa-solid fa-star text-yellow-400 text-xl cursor-pointer"></i>
                            <i class="fa-solid fa-star text-yellow-400 text-xl cursor-pointer"></i>
                            <i class="fa-solid fa-star text-yellow-400 text-xl cursor-pointer"></i>
                            <i class="fa-solid fa-star text-yellow-400 text-xl cursor-pointer"></i>
                        </div>

                        <div>
                            <textarea rows="4" placeholder="Write your comments or suggestions here..." class="w-full p-3 bg-gray-100 rounded-xl border border-gray-300 text-xs focus:outline-none focus:border-[#D35454]"></textarea>
                        </div>

                        <button onclick="showToast('Thank you for your feedback!'); navigate('home');" class="w-full py-3 btn-rose text-white rounded-xl font-bold shadow">SUBMIT FEEDBACK</button>
                    </div>
                </div>
            `;
        }

        function renderStaticPageScreen(title, description) {
            return `
                <div class="flex-1 flex flex-col p-6 pb-20 justify-between">
                    <div>
                        <div class="flex items-center justify-between mb-6">
                            <button onclick="navigate('home')" class="text-xl text-gray-800 p-2"><i class="fa-solid fa-arrow-left"></i></button>
                            <span class="text-sm font-bold text-[#D35454] uppercase">${title}</span>
                            <div class="w-8"></div>
                        </div>

                        <div class="bg-white/90 p-6 rounded-3xl shadow-xl text-center space-y-4">
                            <div class="w-16 h-16 bg-[#D35454]/20 rounded-full flex items-center justify-center mx-auto text-[#D35454] text-2xl">
                                <i class="fa-solid fa-info"></i>
                            </div>
                            <h3 class="font-bold text-lg text-gray-800">${title}</h3>
                            <p class="text-xs text-gray-600 leading-relaxed">${description}</p>
                        </div>
                    </div>

                    ${renderBottomNav('settings')}
                </div>
            `;
        }

        function renderBottomNav(activeTab) {
            return `
                <div class="absolute bottom-0 left-0 right-0 h-16 bg-[#E5A4A4] border-t border-[#D35454]/40 flex items-center justify-around px-6 z-40 shadow-lg">
                    <button onclick="navigate('tasks')" class="flex flex-col items-center ${activeTab === 'tasks' ? 'text-[#A93232] font-bold' : 'text-gray-700 hover:text-gray-900'}">
                        <i class="fa-solid fa-list-check text-lg mb-0.5"></i>
                        <span class="text-[10px] uppercase">TASK</span>
                    </button>
                    <button onclick="navigate('home')" class="flex flex-col items-center ${activeTab === 'home' ? 'text-[#A93232] font-bold' : 'text-gray-700 hover:text-gray-900'}">
                        <i class="fa-solid fa-house text-lg mb-0.5"></i>
                        <span class="text-[10px] uppercase">Home</span>
                    </button>
                    <button onclick="navigate('notes')" class="flex flex-col items-center ${activeTab === 'notes' ? 'text-[#A93232] font-bold' : 'text-gray-700 hover:text-gray-900'}">
                        <i class="fa-solid fa-note-sticky text-lg mb-0.5"></i>
                        <span class="text-[10px] uppercase">Notes</span>
                    </button>
                </div>
            `;
        }

        // --- INTERACTION HANDLERS ---

        function handleLogin() {
            showToast('Login Successful!');
            navigate('home');
        }

        function handleAccountCreation() {
            showToast('Account Created Successfully!');
            navigate('home');
        }

        function toggleTask(id) {
            const task = appState.tasks.find(t => t.id === id);
            if (task) {
                task.done = !task.done;
                render();
            }
        }

        function deleteTask(id) {
            appState.tasks = appState.tasks.filter(t => t.id !== id);
            showToast('Task removed');
            render();
        }

        function addNewTask() {
            const input = document.getElementById('new-task-title');
            if (input && input.value.trim() !== '') {
                appState.tasks.push({
                    id: Date.now(),
                    title: input.value.trim(),
                    done: false,
                    reminder: 'Today, 8:00 PM'
                });
                showToast('Task Added');
                render();
            } else {
                showToast('Please enter task title');
            }
        }

        function updateCharCount() {
            const textarea = document.getElementById('note-content-input');
            const counter = document.getElementById('char-count');
            if (textarea && counter) {
                counter.innerText = `${textarea.value.length} Characters`;
            }
        }

        function sendChatMessage() {
            const input = document.getElementById('chat-input');
            if (input && input.value.trim() !== '') {
                showToast('Message sent to Expert');
                input.value = '';
            }
        }

        // Initial App Load
        window.onload = function() {
            render();
        };
    </script>
</body>
</html>
